name: Build FFmpeg

on:
  push:

permissions:
  contents: write

jobs:
  build_windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (win64)
        env:
          TARGETS: win64
        run: |
          bash winlinux/build.sh

      - name: Prepare Windows archive
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          archive="$(find winlinux/artifacts -type f \( -name '*.zip' -o -name '*.tar.xz' \) -print -quit)"
          if [[ "$archive" == *.zip ]]; then
            unzip -q "$archive" -d "$workdir"
          else
            tar -xf "$archive" -C "$workdir"
          fi
          ffmpeg_path="$(find "$workdir" -type f \( -path '*/bin/ffmpeg.exe' -o -name 'ffmpeg.exe' \) -print -quit)"
          if [[ -z "$ffmpeg_path" ]]; then
            echo "ffmpeg.exe not found"
            exit 1
          fi
          dist="$PWD/dist-windows"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$ffmpeg_path" "$dist/ffmpeg.exe"
          (
            cd "$dist"
            rm -f "$PWD/ffmpeg-windows.zip"
            zip -9 -q "$PWD/ffmpeg-windows.zip" ffmpeg.exe
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows.zip
          path: dist-windows/ffmpeg-windows.zip
          if-no-files-found: error

  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (linux64)
        env:
          TARGETS: linux64
        run: |
          bash winlinux/build.sh

      - name: Prepare Linux archive
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          archive="$(find winlinux/artifacts -type f \( -name '*.tar.xz' -o -name '*.zip' \) -print -quit)"
          if [[ "$archive" == *.zip ]]; then
            unzip -q "$archive" -d "$workdir"
          else
            tar -xf "$archive" -C "$workdir"
          fi
          ffmpeg_path="$(find "$workdir" -type f \( -path '*/bin/ffmpeg' -o -name 'ffmpeg' \) -print -quit)"
          if [[ -z "$ffmpeg_path" ]]; then
            echo "ffmpeg not found"
            exit 1
          fi
          dist="$PWD/dist-linux"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$ffmpeg_path" "$dist/ffmpeg"
          chmod +x "$dist/ffmpeg"
          tar -C "$dist" -cJf "$dist/ffmpeg-linux.tar.xz" ffmpeg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux.tar.xz
          path: dist-linux/ffmpeg-linux.tar.xz
          if-no-files-found: error

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Apple Silicon)
        run: |
          bash macos/build.sh

      - name: Prepare macOS archive
        run: |
          set -euo pipefail
          ffmpeg_path="$(find macos/artifacts -type f -name 'ffmpeg' -print -quit)"
          if [[ -z "$ffmpeg_path" ]]; then
            echo "ffmpeg not found"
            exit 1
          fi
          dist="$PWD/dist-macos"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$ffmpeg_path" "$dist/ffmpeg"
          chmod +x "$dist/ffmpeg"
          tar -C "$dist" -cJf "$dist/ffmpeg-macos.tar.xz" ffmpeg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos.tar.xz
          path: dist-macos/ffmpeg-macos.tar.xz
          if-no-files-found: error

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/ffmpeg')
    needs:
      - build_windows
      - build_linux
      - build_macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title "$tag" --notes "" \
            ffmpeg-windows.zip ffmpeg-macos.tar.xz ffmpeg-linux.tar.xz