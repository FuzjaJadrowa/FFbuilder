name: Build FFmpeg

on:
  push:

permissions:
  contents: write

jobs:
  build_windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (win64)
        env:
          TARGETS: win64
        run: |
          bash winlinux/build.sh

      - name: Prepare Windows binary artifact
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          unzip -q winlinux/artifacts/*.zip -d "$workdir"
          ffmpeg_path="$(find "$workdir" -type f -path '*/bin/ffmpeg.exe' -print -quit)"
          if [[ -z "$ffmpeg_path" ]]; then
            echo "ffmpeg.exe not found"
            exit 1
          fi
          dist="$PWD/dist-windows"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$ffmpeg_path" "$dist/ffmpeg-windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows.exe
          path: dist-windows/ffmpeg-windows.exe
          if-no-files-found: error

  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (linux64)
        env:
          TARGETS: linux64
        run: |
          bash winlinux/build.sh

      - name: Prepare Linux binary artifact
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          tar -xf winlinux/artifacts/*.tar.xz -C "$workdir"
          ffmpeg_path="$(find "$workdir" -type f -path '*/bin/ffmpeg' -print -quit)"
          if [[ -z "$ffmpeg_path" ]]; then
            echo "ffmpeg not found"
            exit 1
          fi
          dist="$PWD/dist-linux"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$ffmpeg_path" "$dist/ffmpeg-linux"
          chmod +x "$dist/ffmpeg-linux"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux
          path: dist-linux/ffmpeg-linux
          if-no-files-found: error

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Apple Silicon)
        run: |
          bash macos/build.sh

      - name: Prepare macOS binary artifact
        run: |
          set -euo pipefail
          ffmpeg_path="macos/artifacts/out/bin/ffmpeg"
          if [[ ! -f "$ffmpeg_path" ]]; then
            echo "ffmpeg not found"
            exit 1
          fi
          dist="$PWD/dist-macos"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$ffmpeg_path" "$dist/ffmpeg-macos"
          chmod +x "$dist/ffmpeg-macos"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: dist-macos/ffmpeg-macos
          if-no-files-found: error

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/ffmpeg')
    needs:
      - build_windows
      - build_linux
      - build_macos
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title "$tag" --notes "" \
            ffmpeg-windows.exe ffmpeg-macos ffmpeg-linux