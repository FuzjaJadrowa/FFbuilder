name: Build FFmpeg

on:
  push:

permissions:
  contents: write

jobs:
  build_windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (win64)
        env:
          TARGETS: win64
        run: |
          bash winlinux/build.sh

      - name: Prepare Windows archive
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          archive="$(find winlinux/artifacts -type f \( -name '*.zip' -o -name '*.tar.xz' \) -print -quit)"
          if [[ "$archive" == *.zip ]]; then
            unzip -q "$archive" -d "$workdir"
          else
            tar -xf "$archive" -C "$workdir"
          fi
          ffmpeg_path="$(find "$workdir" -type f \( -path '*/bin/ffmpeg.exe' -o -name 'ffmpeg.exe' \) -print -quit)"
          ffprobe_path="$(find "$workdir" -type f \( -path '*/bin/ffprobe.exe' -o -name 'ffprobe.exe' \) -print -quit)"
          if [[ -z "$ffmpeg_path" || -z "$ffprobe_path" ]]; then
            echo "ffmpeg.exe or ffprobe.exe not found"
            exit 1
          fi
          deno_asset="deno-x86_64-pc-windows-msvc.zip"
          deno_url="https://github.com/denoland/deno/releases/download/v2.9.8/$deno_asset"
          curl -L -sS -f -o "$workdir/$deno_asset" "$deno_url"
          curl -L -sS -f -o "$workdir/$deno_asset.sha256sum" "$deno_url.sha256sum"
          expected_checksum="$(awk -F ':' '/^Hash[[:space:]]*:/ { gsub(/[[:space:]]/, "", $2); print tolower($2); exit }' "$workdir/$deno_asset.sha256sum")"
          actual_checksum="$(sha256sum "$workdir/$deno_asset" | awk '{print $1}')"
          if [[ ! "$expected_checksum" =~ ^[0-9a-f]{64}$ || "$actual_checksum" != "$expected_checksum" ]]; then
            echo "Deno SHA-256 checksum mismatch"
            exit 1
          fi
          mkdir -p "$workdir/deno"
          unzip -q "$workdir/$deno_asset" -d "$workdir/deno"
          deno_path="$(find "$workdir/deno" -type f -name 'deno.exe' -print -quit)"
          if [[ -z "$deno_path" ]]; then
            echo "deno.exe not found in the downloaded archive"
            exit 1
          fi
          dist="$PWD/dist-windows"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$ffmpeg_path" "$dist/ffmpeg.exe"
          cp "$ffprobe_path" "$dist/ffprobe.exe"
          cp "$deno_path" "$dist/deno.exe"
          (
            cd "$dist"
            rm -f "$PWD/ffmpeg-windows.zip"
            zip -9 -q "$PWD/ffmpeg-windows.zip" ffmpeg.exe ffprobe.exe deno.exe
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows.zip
          path: dist-windows/ffmpeg-windows.zip
          if-no-files-found: error

  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (linux64)
        env:
          TARGETS: linux64
        run: |
          bash winlinux/build.sh

      - name: Prepare Linux archive
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          archive="$(find winlinux/artifacts -type f \( -name '*.tar.xz' -o -name '*.zip' \) -print -quit)"
          if [[ "$archive" == *.zip ]]; then
            unzip -q "$archive" -d "$workdir"
          else
            tar -xf "$archive" -C "$workdir"
          fi
          ffmpeg_path="$(find "$workdir" -type f \( -path '*/bin/ffmpeg' -o -name 'ffmpeg' \) -print -quit)"
          ffprobe_path="$(find "$workdir" -type f \( -path '*/bin/ffprobe' -o -name 'ffprobe' \) -print -quit)"
          if [[ -z "$ffmpeg_path" || -z "$ffprobe_path" ]]; then
            echo "ffmpeg or ffprobe not found"
            exit 1
          fi
          deno_asset="deno-x86_64-unknown-linux-gnu.zip"
          deno_url="https://github.com/denoland/deno/releases/download/v2.9.8/$deno_asset"
          curl -L -sS -f -o "$workdir/$deno_asset" "$deno_url"
          curl -L -sS -f -o "$workdir/$deno_asset.sha256sum" "$deno_url.sha256sum"
          expected_checksum="$(awk 'NF >= 2 && $1 ~ /^[[:xdigit:]]+$/ { print tolower($1); exit }' "$workdir/$deno_asset.sha256sum")"
          actual_checksum="$(sha256sum "$workdir/$deno_asset" | awk '{print $1}')"
          if [[ ! "$expected_checksum" =~ ^[0-9a-f]{64}$ || "$actual_checksum" != "$expected_checksum" ]]; then
            echo "Deno SHA-256 checksum mismatch"
            exit 1
          fi
          mkdir -p "$workdir/deno"
          unzip -q "$workdir/$deno_asset" -d "$workdir/deno"
          deno_path="$(find "$workdir/deno" -type f -name 'deno' -print -quit)"
          if [[ -z "$deno_path" ]]; then
            echo "deno not found in the downloaded archive"
            exit 1
          fi
          dist="$PWD/dist-linux"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$ffmpeg_path" "$dist/ffmpeg"
          cp "$ffprobe_path" "$dist/ffprobe"
          cp "$deno_path" "$dist/deno"
          chmod +x "$dist/ffmpeg" "$dist/ffprobe" "$dist/deno"
          tar -C "$dist" -cJf "$dist/ffmpeg-linux.tar.xz" ffmpeg ffprobe deno

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux.tar.xz
          path: dist-linux/ffmpeg-linux.tar.xz
          if-no-files-found: error

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Apple Silicon)
        run: |
          bash macos/build.sh

      - name: Prepare macOS archive
        run: |
          set -euo pipefail
          ffmpeg_path="$(find macos/artifacts -type f -name 'ffmpeg' -print -quit)"
          ffprobe_path="$(find macos/artifacts -type f -name 'ffprobe' -print -quit)"
          if [[ -z "$ffmpeg_path" || -z "$ffprobe_path" ]]; then
            echo "ffmpeg or ffprobe not found"
            exit 1
          fi
          deno_asset="deno-aarch64-apple-darwin.zip"
          deno_url="https://github.com/denoland/deno/releases/download/v2.9.8/$deno_asset"
          curl -L -sS -f -o "$workdir/$deno_asset" "$deno_url"
          curl -L -sS -f -o "$workdir/$deno_asset.sha256sum" "$deno_url.sha256sum"
          expected_checksum="$(awk 'NF >= 2 && $1 ~ /^[[:xdigit:]]+$/ { print tolower($1); exit }' "$workdir/$deno_asset.sha256sum")"
          actual_checksum="$(shasum -a 256 "$workdir/$deno_asset" | awk '{print $1}')"
          if [[ ! "$expected_checksum" =~ ^[0-9a-f]{64}$ || "$actual_checksum" != "$expected_checksum" ]]; then
            echo "Deno SHA-256 checksum mismatch"
            exit 1
          fi
          mkdir -p "$workdir/deno"
          unzip -q "$workdir/$deno_asset" -d "$workdir/deno"
          deno_path="$(find "$workdir/deno" -type f -name 'deno' -print -quit)"
          if [[ -z "$deno_path" ]]; then
            echo "deno not found in the downloaded archive"
            exit 1
          fi
          dist="$PWD/dist-macos"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$ffmpeg_path" "$dist/ffmpeg"
          cp "$ffprobe_path" "$dist/ffprobe"
          cp "$deno_path" "$dist/deno"
          chmod +x "$dist/ffmpeg" "$dist/ffprobe" "$dist/deno"
          tar -C "$dist" -cJf "$dist/ffmpeg-macos.tar.xz" ffmpeg ffprobe deno

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos.tar.xz
          path: dist-macos/ffmpeg-macos.tar.xz
          if-no-files-found: error

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/ffmpeg')
    needs:
      - build_windows
      - build_linux
      - build_macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title "$tag" --notes "" \
            ffmpeg-windows.zip ffmpeg-macos.tar.xz ffmpeg-linux.tar.xz